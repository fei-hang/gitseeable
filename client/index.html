<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git 仓库可视化工具</title>
    <!-- 首帧配色：作为 DSH 插件嵌入时宿主会在 URL 里带 ?theme=dark|light。
         在样式表和脚本执行前先写到 <html> 上，避免深色宿主里闪一下白屏。 -->
    <script>
      (function () {
        var scheme = new URLSearchParams(window.location.search).get('theme');
        if (scheme !== 'dark' && scheme !== 'light') scheme = null;
        if (scheme) {
          document.documentElement.dataset.theme = scheme;
          document.documentElement.style.colorScheme = scheme;
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
